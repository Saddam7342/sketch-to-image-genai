[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sketch2image"
version = "0.1.0"
description = "Sketch-to-image generation with Stable Diffusion + ControlNet, with quantitative sketch-preservation evaluation"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "torch>=2.1",
  "diffusers>=0.30",
  "transformers>=4.40",
  "accelerate>=0.30",
  "peft>=0.10",
  "safetensors",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
  "numpy",
  "Pillow>=10.1",
  "PyYAML",
  "pandas",
  "matplotlib",
]

[project.optional-dependencies]
aux = ["controlnet-aux>=0.0.9"]
app = ["gradio>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
